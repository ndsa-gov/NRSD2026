<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#071627" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>NRSD 2026 — National Dashboard | National Dam Safety Authority</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   NRSD 2026 — Design tokens & layout
   ============================================================ */
:root{
  --bg-deep:#071627;
  --bg-panel:#0D2338;
  --bg-panel-2:#112B44;
  --bg-card:#0F2740;
  --line:#1D3B57;
  --text-hi:#EFF6FC;
  --text-mid:#AFC4D6;
  --text-lo:#6E8AA1;
  --accent-blue:#4FA3E0;
  --accent-blue-deep:#1B6CB4;
  --accent-saffron:#FF9933;
  --accent-green:#3FAE6B;
  --radius-lg:18px;
  --radius-md:12px;
  --radius-sm:8px;
  --font-display:'Manrope', 'Segoe UI', system-ui, sans-serif;
  --font-body:'Inter', 'Segoe UI', system-ui, sans-serif;
}

*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body{ height:100%; width:100%; margin:0; overscroll-behavior:none; }
body{
  background: radial-gradient(ellipse at 20% -10%, #0F3255 0%, var(--bg-deep) 55%);
  color:var(--text-hi);
  font-family:var(--font-body);
  overflow:hidden;
}
h1,h2,h3{ font-family:var(--font-display); margin:0; font-weight:800; letter-spacing:-0.01em; }
p{ margin:0; color:var(--text-mid); line-height:1.55; }
button{ font-family:inherit; }

.screen{ display:none; width:100%; height:100vh; height:100dvh; }
.screen.active{ display:flex; }

/* ---------------- HOME ---------------- */
#home-screen{
  flex-direction:column;
  align-items:center;
  justify-content:space-between;
  padding:calc(48px + env(safe-area-inset-top)) calc(64px + env(safe-area-inset-right)) calc(64px + env(safe-area-inset-bottom)) calc(64px + env(safe-area-inset-left));
  position:relative;
  background:
    radial-gradient(circle at 50% 0%, rgba(79,163,224,0.14), transparent 55%),
    radial-gradient(circle at 85% 85%, rgba(255,153,51,0.08), transparent 45%),
    var(--bg-deep);
}
.india-silhouette{
  position:absolute; right:-6%; top:8%; width:52%; opacity:0.05; pointer-events:none;
}
.home-header{ display:flex; align-items:center; gap:20px; align-self:flex-start; }
.home-header img{ width:78px; height:78px; }
.home-header .org-name-en{ font-family:var(--font-display); font-size:20px; font-weight:800; color:var(--text-hi); }
.home-header .org-name-hi{ font-size:14px; color:var(--text-mid); margin-top:2px; }

.home-center{ display:flex; flex-direction:column; align-items:center; gap:10px; text-align:center; }
.home-eyebrow{ color:var(--accent-blue); font-size:16px; font-weight:600; letter-spacing:0.02em; }
.home-title{ font-size:clamp(40px, 5vw, 72px); line-height:1.02; }
.home-title .accent{ color:var(--accent-saffron); }
.home-subtitle{ color:var(--text-mid); font-size:18px; max-width:640px; margin-top:6px; }

#home-counters{
  display:flex; gap:28px; margin-top:8px; flex-wrap:wrap; justify-content:center;
}
.home-stat{
  min-width:150px;
  padding:18px 22px;
  background:linear-gradient(180deg, rgba(79,163,224,0.10), rgba(79,163,224,0.02));
  border:1px solid var(--line);
  border-radius:var(--radius-lg);
  text-align:center;
}
.counter{ font-family:var(--font-display); font-size:clamp(28px,3vw,42px); font-weight:800; color:var(--text-hi); font-variant-numeric:tabular-nums; }
.home-stat-label{ color:var(--text-mid); font-size:13px; margin-top:6px; }

.cta-wrap{ display:flex; flex-direction:column; align-items:center; gap:10px; }
.btn-cta{
  position:relative;
  padding:20px 56px;
  font-size:20px;
  font-weight:800;
  font-family:var(--font-display);
  color:#04141F;
  background:linear-gradient(135deg, var(--accent-blue), #7FC4F0);
  border:none;
  border-radius:999px;
  cursor:pointer;
  box-shadow:0 0 0 0 rgba(79,163,224,0.5);
  animation:pulse 2.4s ease-out infinite;
}
.btn-cta:active{ transform:scale(0.98); }
@keyframes pulse{
  0%{ box-shadow:0 0 0 0 rgba(79,163,224,0.45); }
  70%{ box-shadow:0 0 0 26px rgba(79,163,224,0); }
  100%{ box-shadow:0 0 0 0 rgba(79,163,224,0); }
}
.cta-hint{ color:var(--text-lo); font-size:13px; }

/* ---------------- APP SHELL ---------------- */
#app-screen{ flex-direction:row; }
#side-nav{
  width:280px; flex-shrink:0;
  background:var(--bg-panel);
  border-right:1px solid var(--line);
  display:flex; flex-direction:column;
  padding:20px 14px;
  gap:4px;
  overflow-y:auto;
}
.nav-brand{
  display:flex; align-items:center; gap:10px;
  padding:8px 10px 20px;
  border-bottom:1px solid var(--line);
  margin-bottom:10px;
}
.nav-brand img{ width:38px; height:38px; }
.nav-brand span{ font-family:var(--font-display); font-weight:800; font-size:15px; }
.nav-item{
  display:flex; align-items:center; gap:12px;
  background:transparent; border:none; color:var(--text-mid);
  padding:13px 14px; border-radius:var(--radius-md);
  font-size:14.5px; font-weight:600; text-align:left; cursor:pointer;
  transition:background 150ms, color 150ms;
}
.nav-item .icon{ width:19px; height:19px; flex-shrink:0; }
.nav-item:hover{ background:var(--bg-panel-2); color:var(--text-hi); }
.nav-item.active{ background:linear-gradient(135deg, var(--accent-blue-deep), #123A5C); color:#fff; }
.nav-footer{ margin-top:auto; padding-top:14px; border-top:1px solid var(--line); }
.btn-home{
  display:flex; align-items:center; gap:10px; width:100%;
  background:var(--bg-panel-2); border:1px solid var(--line); color:var(--text-mid);
  padding:12px 14px; border-radius:var(--radius-md); cursor:pointer; font-weight:600; font-size:13.5px;
}
.btn-home:hover{ color:var(--text-hi); }

#content{
  flex:1; overflow-y:auto; padding:32px 40px 60px;
  -webkit-overflow-scrolling:touch;
}
#content.content-map{
  padding:16px 20px 16px;
  display:flex;
  flex-direction:column;
  overflow:hidden;
}
.map-panel-head{ margin-bottom:10px; flex-shrink:0; }
.map-panel-head h2{ font-size:22px; }
.panel-head{ display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:22px; }
.panel-head h2{ font-size:28px; }
.panel-sub{ margin-top:6px; max-width:760px; }

/* ---------------- Stat cards & cards ---------------- */
.stat-grid{ display:grid; grid-template-columns:repeat(6,1fr); gap:16px; margin-bottom:26px; }
.stat-card{
  background:var(--bg-card); border:1px solid var(--line); border-radius:var(--radius-lg);
  padding:20px 16px; text-align:center;
}
.stat-val{ font-family:var(--font-display); font-size:26px; font-weight:800; color:var(--accent-blue); font-variant-numeric:tabular-nums; }
.stat-unit{ font-size:13px; color:var(--text-lo); margin-left:4px; }
.stat-label{ color:var(--text-mid); font-size:12.5px; margin-top:6px; }

.grid-2{ display:grid; grid-template-columns:1fr 1fr; gap:20px; margin-bottom:20px; }
.card{
  background:var(--bg-card); border:1px solid var(--line); border-radius:var(--radius-lg);
  padding:20px 22px 24px;
}
.card h3{ font-size:15px; font-weight:700; color:var(--text-hi); margin-bottom:14px; }
.card.span-2{ grid-column: span 2; }
.analytics-grid{ display:grid; grid-template-columns:1fr 1fr; gap:20px; }

/* ---------------- Segmented control ---------------- */
.segmented{ display:flex; gap:8px; margin-bottom:20px; flex-wrap:wrap; }
.seg-btn{
  background:var(--bg-card); border:1px solid var(--line); color:var(--text-mid);
  padding:10px 18px; border-radius:999px; cursor:pointer; font-weight:600; font-size:13.5px;
}
.seg-btn.active{ background:var(--accent-blue); border-color:var(--accent-blue); color:#04141F; }

/* ---------------- Charts ---------------- */
.chart-holder{ position:relative; width:100%; }
.chart-holder-tall{ max-height:520px; overflow-y:auto; }
.chart-wrap{ position:relative; }
.chart-tooltip{
  position:absolute; pointer-events:none; opacity:0; transition:opacity 100ms;
  background:#04141F; border:1px solid var(--line); color:var(--text-hi);
  padding:8px 12px; border-radius:8px; font-size:12.5px; z-index:20; white-space:nowrap;
  box-shadow:0 8px 24px rgba(0,0,0,0.4);
}
.chart-svg text{ font-family:var(--font-body); fill:var(--text-mid); }
.chart-label{ fill:var(--text-mid); font-size:12px; }
.chart-value{ fill:var(--text-hi); font-size:12px; font-weight:600; }
.chart-axis{ fill:var(--text-lo); font-size:11px; }
.chart-track{ fill:rgba(255,255,255,0.04); }
.chart-grid{ stroke:var(--line); stroke-width:1; }
.area-fill{ }
.donut-flex{ display:flex; align-items:center; gap:22px; flex-wrap:wrap; }
.donut-center-num{ font-family:var(--font-display); font-size:22px; font-weight:800; fill:var(--text-hi); }
.donut-center-lbl{ font-size:11px; fill:var(--text-lo); }
.chart-legend{ display:flex; flex-direction:column; gap:8px; flex:1; min-width:180px; }
.chart-legend.inline-legend{ flex-direction:row; gap:20px; margin-bottom:12px; }
.legend-item{ display:flex; align-items:center; gap:8px; font-size:12.5px; color:var(--text-mid); }
.legend-dot{ width:10px; height:10px; border-radius:3px; flex-shrink:0; }
.legend-lbl{ flex:1; }
.legend-val{ color:var(--text-hi); font-weight:600; }

.tile-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
.state-tile{ border-radius:var(--radius-md); padding:12px 14px; border:1px solid var(--line); }
.tile-rank{ font-size:10.5px; color:var(--text-lo); font-weight:700; }
.tile-name{ font-size:13px; font-weight:700; color:var(--text-hi); margin:2px 0; }
.tile-val{ font-size:12px; color:var(--text-mid); }

.grouped-grid{ display:flex; flex-direction:column; gap:10px; }
.grouped-row{ display:grid; grid-template-columns:140px 1fr 70px; align-items:center; gap:10px; }
.grouped-label{ font-size:12.5px; color:var(--text-mid); }
.grouped-track{ height:16px; border-radius:6px; overflow:hidden; display:flex; background:rgba(255,255,255,0.04); min-width:24px; }
.grouped-seg{ height:100%; }
.grouped-val{ font-size:12px; color:var(--text-hi); font-weight:600; text-align:right; }

/* ---------------- Tables ---------------- */
.table-toolbar{ display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; gap:16px; flex-wrap:wrap; }
.search-box{
  display:flex; align-items:center; gap:8px; background:var(--bg-card); border:1px solid var(--line);
  border-radius:999px; padding:10px 16px; min-width:320px;
}
.search-box .icon{ width:16px; height:16px; color:var(--text-lo); flex-shrink:0; }
.search-box input{
  background:transparent; border:none; outline:none; color:var(--text-hi); font-size:14px; width:100%;
}
.search-box input::placeholder{ color:var(--text-lo); }
.row-count, .footer-stat{ color:var(--text-mid); font-size:13px; font-weight:600; }
.table-head-row{ display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; }
.table-card{ padding-top:16px; }
.scroll-mirror{
  overflow-x:auto; overflow-y:hidden; height:18px; margin-bottom:10px;
  border-radius:8px; background:var(--bg-panel-2); border:1px solid var(--line);
  scrollbar-width:thin; scrollbar-color:var(--accent-blue) transparent;
}
.scroll-mirror-inner{ height:1px; }
.table-scroll{
  overflow:auto; max-height:460px; border-radius:var(--radius-md); border:1px solid var(--line);
  scrollbar-width:thin; scrollbar-color:var(--accent-blue) transparent;
}
.table-scroll.tall{ max-height:560px; }
.data-table{ width:100%; border-collapse:collapse; font-size:13px; }
.data-table th{
  position:sticky; top:0; background:var(--bg-panel-2); color:var(--text-mid);
  text-align:left; padding:11px 14px; font-weight:700; cursor:pointer; white-space:nowrap;
  border-bottom:1px solid var(--line); user-select:none; font-size:12px; letter-spacing:0.01em;
}
.data-table th:hover{ color:var(--text-hi); }
.data-table th.sorted-asc, .data-table th.sorted-desc{ color:var(--accent-blue); }
.data-table td{ padding:10px 14px; border-bottom:1px solid rgba(29,59,87,0.5); color:var(--text-hi); white-space:nowrap; }
.data-table td.num{ text-align:right; font-variant-numeric:tabular-nums; color:var(--text-mid); }
.data-table tr:hover td{ background:rgba(79,163,224,0.05); }
.scrollpane{ overflow-y:auto; }

/* ---------------- Map Explorer ---------------- */
.iframe-wrap{ position:relative; flex:1; min-height:0; border-radius:var(--radius-lg); overflow:hidden; border:1px solid var(--line); background:var(--bg-card); }
#map-frame{ width:100%; height:100%; border:none; }
.iframe-status{
  position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:14px; background:var(--bg-card); color:var(--text-mid); font-size:14px;
}
.spinner{ width:34px; height:34px; border-radius:50%; border:3px solid var(--line); border-top-color:var(--accent-blue); animation:spin 0.9s linear infinite; }
@keyframes spin{ to{ transform:rotate(360deg); } }
.btn-retry{ background:var(--accent-blue); border:none; color:#04141F; font-weight:700; padding:10px 22px; border-radius:999px; cursor:pointer; }

/* ---------------- About ---------------- */
.about-grid{ display:grid; grid-template-columns:1fr 1fr; gap:20px; }
.about-card p{ font-size:14px; }
.glossary{ margin:0; padding-left:18px; font-size:13.5px; color:var(--text-mid); display:flex; flex-direction:column; gap:8px; }
.glossary strong{ color:var(--text-hi); }

/* ---------------- Icons ---------------- */
.icon{ width:20px; height:20px; }

/* ---------------- Scrollbar ---------------- */
#content::-webkit-scrollbar, .table-scroll::-webkit-scrollbar, .scrollpane::-webkit-scrollbar, #side-nav::-webkit-scrollbar{ width:9px; height:9px; }
#content::-webkit-scrollbar-thumb, .table-scroll::-webkit-scrollbar-thumb, .scrollpane::-webkit-scrollbar-thumb{ background:var(--line); border-radius:8px; }
#content::-webkit-scrollbar-track, .table-scroll::-webkit-scrollbar-track{ background:transparent; }
.scroll-mirror::-webkit-scrollbar{ height:12px; }
.scroll-mirror::-webkit-scrollbar-thumb{ background:var(--accent-blue); border-radius:8px; border:3px solid var(--bg-panel-2); }
.scroll-mirror::-webkit-scrollbar-track{ background:transparent; }

/* ---------------- Responsive: tablets ---------------- */
@media (max-width: 1200px){
  .stat-grid{ grid-template-columns:repeat(3,1fr); }
  .grid-2, .analytics-grid, .about-grid{ grid-template-columns:1fr; }
  .card.span-2{ grid-column:span 1; }
  #side-nav{ width:220px; }
}

/* ---------------- Responsive: phones & narrow tablets ---------------- */
@media (max-width: 860px){
  #app-screen{ flex-direction:column; }

  #side-nav{
    width:100%; height:auto; flex-direction:row; align-items:center;
    padding:8px calc(8px + env(safe-area-inset-right)) 8px calc(8px + env(safe-area-inset-left));
    padding-top:calc(8px + env(safe-area-inset-top));
    border-right:none; border-bottom:1px solid var(--line);
    overflow-x:auto; overflow-y:hidden; gap:0; flex-shrink:0;
    -webkit-overflow-scrolling:touch;
  }
  .nav-brand{
    display:flex; flex-shrink:0; padding:4px 10px 4px 2px; margin-bottom:0;
    border-bottom:none; border-right:1px solid var(--line);
  }
  .nav-brand img{ width:28px; height:28px; }
  .nav-brand span{ font-size:12px; white-space:nowrap; }
  #nav-items{ display:flex; flex-direction:row; gap:4px; flex-shrink:0; }
  .nav-item{
    flex-direction:column; gap:3px; padding:8px 12px; font-size:10.5px;
    white-space:nowrap; border-radius:10px;
  }
  .nav-item .icon{ width:18px; height:18px; }
  .nav-item span{ font-size:10.5px; }
  .nav-footer{
    margin-top:0; padding-top:0; border-top:none; flex-shrink:0;
    margin-left:auto; padding-left:8px;
    position:sticky; right:0; background:var(--bg-panel); z-index:2;
  }
  .btn-home{ padding:10px; border-radius:10px; }
  .btn-home span{ display:none; }

  #content{
    padding:18px 16px calc(24px + env(safe-area-inset-bottom));
  }
  #content.content-map{
    padding:12px 12px calc(12px + env(safe-area-inset-bottom));
  }

  .panel-head{ flex-direction:column; align-items:flex-start; gap:6px; margin-bottom:16px; }
  .panel-head h2{ font-size:21px; }

  .stat-grid{ grid-template-columns:repeat(2,1fr); gap:10px; }
  .stat-val{ font-size:20px; }
  .grid-2, .analytics-grid, .about-grid{ grid-template-columns:1fr; gap:14px; }
  .card{ padding:16px 16px 18px; }
  .card.span-2{ grid-column:span 1; }

  .tile-grid{ grid-template-columns:repeat(2,1fr); }
  .grouped-row{ grid-template-columns:92px 1fr 54px; gap:6px; }
  .grouped-label{ font-size:11px; }

  .segmented{ gap:6px; }
  .seg-btn{ padding:8px 14px; font-size:12.5px; }

  .search-box{ min-width:0; width:100%; }
  .table-toolbar{ flex-direction:column; align-items:stretch; gap:10px; }
  .footer-stat, .row-count{ font-size:12px; }

  .donut-flex{ flex-direction:column; align-items:flex-start; }

  .iframe-wrap{ border-radius:12px; }

  /* Home screen */
  #home-screen{
    padding:calc(20px + env(safe-area-inset-top)) 20px calc(28px + env(safe-area-inset-bottom));
    justify-content:flex-start;
    gap:28px;
    overflow-y:auto;
  }
  .home-header{ gap:12px; }
  .home-header img{ width:52px; height:52px; }
  .home-header .org-name-en{ font-size:15px; }
  .home-header .org-name-hi{ font-size:11.5px; }
  .home-center{ gap:8px; margin-top:8px; }
  .home-eyebrow{ font-size:12.5px; }
  .home-title{ font-size:14vw; }
  #home-counters{ gap:12px; }
  .home-stat{ min-width:104px; padding:12px 14px; }
  .counter{ font-size:22px; }
  .home-stat-label{ font-size:11px; }
  .btn-cta{ padding:16px 40px; font-size:16px; }
  .cta-wrap{ margin-top:auto; padding-top:10px; }
}

@media (max-width: 420px){
  .stat-grid{ grid-template-columns:1fr 1fr; }
  .tile-grid{ grid-template-columns:1fr; }
  .home-stat{ min-width:44%; }
  .home-title{ font-size:15vw; }
  .nav-item{ padding:7px 10px; }
}

@media (max-width: 860px) and (orientation:landscape){
  #home-screen{ justify-content:center; gap:16px; }
  .home-title{ font-size:9vw; }
  #home-counters{ flex-wrap:wrap; }
}

</style>
</head>
<body>

<!-- ============ HOME SCREEN ============ -->

<script>
/* ============================================================
   NRSD 2026 — National Dashboard
   Vanilla JS application logic (no framework, no external deps)
   ============================================================ */

/* ---------- Utilities ---------- */
const $ = (sel, root=document) => root.querySelector(sel);
const $$ = (sel, root=document) => Array.from(root.querySelectorAll(sel));

function fmtInt(n){
  if(n===null || n===undefined || isNaN(n)) return 'N/A';
  return Math.round(n).toLocaleString('en-IN');
}
function fmtDec(n, d=3){
  if(n===null || n===undefined || isNaN(n)) return 'N/A';
  return Number(n).toLocaleString('en-IN', {minimumFractionDigits:d, maximumFractionDigits:d});
}
function cleanLabel(s){
  if(s===null || s===undefined) return 'N/A';
  return String(s).replace(/\s+/g,' ').trim();
}
function safeNum(v){
  if(v===null || v===undefined) return null;
  if(typeof v === 'string'){
    if(v.trim()==='-' || v.trim()==='') return null;
    const n = parseFloat(v.replace(/,/g,''));
    return isNaN(n) ? null : n;
  }
  if(typeof v === 'number' && isNaN(v)) return null;
  return v;
}
function easeOutQuint(t){ return 1 - Math.pow(1-t, 5); }

function animateCounter(el, target, opts={}){
  const dur = opts.duration || 2000;
  const decimals = opts.decimals || 0;
  const delay = opts.delay || 0;
  const suffix = opts.suffix || '';
  const start = performance.now() + delay;
  function frame(now){
    if(now < start){ requestAnimationFrame(frame); return; }
    const elapsed = now - start;
    const t = Math.min(elapsed / dur, 1);
    const eased = easeOutQuint(t);
    const val = target * eased;
    el.textContent = decimals > 0
      ? val.toLocaleString('en-IN', {minimumFractionDigits:decimals, maximumFractionDigits:decimals}) + suffix
      : Math.round(val).toLocaleString('en-IN') + suffix;
    if(t < 1) requestAnimationFrame(frame);
    else {
      el.textContent = (decimals > 0 ? target.toLocaleString('en-IN', {minimumFractionDigits:decimals, maximumFractionDigits:decimals}) : Math.round(target).toLocaleString('en-IN')) + suffix;
    }
  }
  requestAnimationFrame(frame);
}

/* ---------- Colour system ---------- */
const PALETTE = ['#4FA3E0','#FF9933','#3FAE6B','#C77DFF','#F2C14E','#E0607E','#6FCF97','#7C93A8','#4DD0E1','#D97757','#9E7BFF','#5CC8C2'];
function colorFor(i){ return PALETTE[i % PALETTE.length]; }

const SEISMIC_COLORS = { 'Seismic Zone - II':'#3FAE6B','Seismic Zone - III':'#F2C14E','Seismic Zone - IV':'#E0824A','Seismic Zone - V':'#E0526B' };
const STATE_COLOR_MAP = {};
function stateColor(state, idx){
  if(!STATE_COLOR_MAP[state]) STATE_COLOR_MAP[state] = colorFor(Object.keys(STATE_COLOR_MAP).length);
  return STATE_COLOR_MAP[state];
}

/* ============================================================
   Tiny SVG chart engine
   ============================================================ */
const NS = 'http://www.w3.org/2000/svg';
function svgEl(tag, attrs={}){
  const e = document.createElementNS(NS, tag);
  for(const k in attrs) e.setAttribute(k, attrs[k]);
  return e;
}

function makeTooltip(container){
  let tip = container.querySelector('.chart-tooltip');
  if(!tip){
    tip = document.createElement('div');
    tip.className = 'chart-tooltip';
    container.appendChild(tip);
  }
  return tip;
}

function showTip(container, tip, evt, html){
  tip.innerHTML = html;
  tip.style.opacity = '1';
  const rect = container.getBoundingClientRect();
  let x = evt.clientX - rect.left + 14;
  let y = evt.clientY - rect.top + 14;
  tip.style.left = x + 'px';
  tip.style.top = y + 'px';
}
function hideTip(tip){ tip.style.opacity = '0'; }

/* Horizontal ranked bar chart */
function renderHBar(container, data, opts={}){
  container.innerHTML = '';
  container.classList.add('chart-wrap');
  const w = container.clientWidth || 600;
  const rowH = opts.rowH || 30;
  const gap = opts.gap || 10;
  const labelW = opts.labelW || 190;
  const valueW = 80;
  const chartW = w - labelW - valueW - 20;
  const n = data.length;
  const h = n * (rowH + gap) + 10;
  const max = Math.max(...data.map(d=>d.value), 1);

  const svg = svgEl('svg', {viewBox:`0 0 ${w} ${h}`, width:'100%', height:h, class:'chart-svg'});
  const tip = makeTooltip(container);

  data.forEach((d,i)=>{
    const y = i*(rowH+gap)+5;
    const barW = Math.max((d.value/max)*chartW, 2);
    const color = d.color || colorFor(i);

    const label = svgEl('text', {x:labelW-10, y:y+rowH/2+4, 'text-anchor':'end', class:'chart-label'});
    label.textContent = d.label.length > 26 ? d.label.slice(0,25)+'…' : d.label;
    svg.appendChild(label);

    const track = svgEl('rect', {x:labelW, y, width:chartW, height:rowH, rx:6, class:'chart-track'});
    svg.appendChild(track);

    const bar = svgEl('rect', {x:labelW, y, width:0, height:rowH, rx:6, fill:color, class:'chart-bar'});
    svg.appendChild(bar);
    requestAnimationFrame(()=>{ bar.style.transition = `width 900ms cubic-bezier(.16,.9,.3,1) ${i*30}ms`; bar.setAttribute('width', barW); });

    const valTxt = svgEl('text', {x:labelW+chartW+10, y:y+rowH/2+4, class:'chart-value'});
    valTxt.textContent = opts.fmt ? opts.fmt(d.value) : fmtInt(d.value);
    svg.appendChild(valTxt);

    const hit = svgEl('rect', {x:labelW, y, width:chartW, height:rowH, fill:'transparent', style:'cursor:pointer'});
    hit.addEventListener('mousemove', (e)=> showTip(container, tip, e, `<strong>${d.label}</strong><br>${opts.fmt ? opts.fmt(d.value) : fmtInt(d.value)}${opts.unit||''}`));
    hit.addEventListener('mouseleave', ()=> hideTip(tip));
    svg.appendChild(hit);
  });

  container.appendChild(svg);
}

/* Vertical bar chart (grouped optionally) */
function renderVBar(container, data, opts={}){
  container.innerHTML='';
  container.classList.add('chart-wrap');
  const w = container.clientWidth || 600;
  const h = opts.height || 320;
  const padL = 50, padB = 70, padT = 34, padR = 20;
  const chartW = w - padL - padR;
  const chartH = h - padT - padB;
  const max = Math.max(...data.map(d=>d.value), 1) * 1.22;
  const n = data.length;
  const bw = chartW/n * 0.6;
  const step = chartW/n;

  const svg = svgEl('svg', {viewBox:`0 0 ${w} ${h}`, width:'100%', height:h, class:'chart-svg'});
  const tip = makeTooltip(container);

  // gridlines
  for(let g=0; g<=4; g++){
    const gy = padT + chartH - (chartH*g/4);
    svg.appendChild(svgEl('line', {x1:padL, x2:padL+chartW, y1:gy, y2:gy, class:'chart-grid'}));
    const gt = svgEl('text', {x:padL-8, y:gy+4, 'text-anchor':'end', class:'chart-axis'});
    gt.textContent = fmtInt(max*g/4);
    svg.appendChild(gt);
  }

  data.forEach((d,i)=>{
    const x = padL + step*i + (step-bw)/2;
    const barH = (d.value/max)*chartH;
    const color = d.color || colorFor(i);
    const bar = svgEl('rect', {x, y:padT+chartH, width:bw, height:0, rx:5, fill:color});
    svg.appendChild(bar);
    const valLbl = svgEl('text', {x:x+bw/2, y:padT+chartH-barH-8, 'text-anchor':'middle', class:'chart-value', opacity:0});
    valLbl.textContent = opts.fmt ? opts.fmt(d.value) : fmtInt(d.value);
    svg.appendChild(valLbl);
    requestAnimationFrame(()=>{
      bar.style.transition = `y 800ms cubic-bezier(.16,.9,.3,1) ${i*40}ms, height 800ms cubic-bezier(.16,.9,.3,1) ${i*40}ms`;
      bar.setAttribute('y', padT+chartH-barH);
      bar.setAttribute('height', barH);
      valLbl.style.transition = `opacity 400ms ease ${i*40+500}ms`;
      valLbl.setAttribute('opacity', 1);
    });
    const lbl = svgEl('text', {x:x+bw/2, y:padT+chartH+18, 'text-anchor':'middle', class:'chart-axis'});
    const short = d.label.length > 14 ? d.label.slice(0,13)+'…' : d.label;
    lbl.textContent = short;
    if(opts.rotateLabels){
      lbl.setAttribute('transform', `rotate(-30 ${x+bw/2} ${padT+chartH+14})`);
      lbl.setAttribute('text-anchor','end');
    }
    svg.appendChild(lbl);

    const hit = svgEl('rect', {x, y:padT, width:bw, height:chartH, fill:'transparent', style:'cursor:pointer'});
    hit.addEventListener('mousemove', (e)=> showTip(container, tip, e, `<strong>${d.label}</strong><br>${opts.fmt ? opts.fmt(d.value) : fmtInt(d.value)}${opts.unit||''}`));
    hit.addEventListener('mouseleave', ()=> hideTip(tip));
    svg.appendChild(hit);
  });

  container.appendChild(svg);
}

/* Donut / pie chart */
function renderDonut(container, data, opts={}){
  container.innerHTML='';
  container.classList.add('chart-wrap','chart-wrap-donut');
  const size = opts.size || Math.min(container.clientWidth || 320, 320);
  const cx = size/2, cy = size/2;
  const rOuter = size/2 - 8;
  const rInner = opts.donut===false ? 0 : rOuter*0.58;
  const total = data.reduce((a,d)=>a+d.value,0) || 1;

  const wrap = document.createElement('div');
  wrap.className = 'donut-flex';
  const svg = svgEl('svg', {viewBox:`0 0 ${size} ${size}`, width:size, height:size, class:'chart-svg'});
  const tip = makeTooltip(container);

  let angle = -Math.PI/2;
  data.forEach((d,i)=>{
    const frac = d.value/total;
    const sweep = frac * Math.PI*2;
    const color = d.color || colorFor(i);
    const a0 = angle, a1 = angle+sweep;
    const x0 = cx + rOuter*Math.cos(a0), y0 = cy + rOuter*Math.sin(a0);
    const x1 = cx + rOuter*Math.cos(a1), y1 = cy + rOuter*Math.sin(a1);
    const xi0 = cx + rInner*Math.cos(a1), yi0 = cy + rInner*Math.sin(a1);
    const xi1 = cx + rInner*Math.cos(a0), yi1 = cy + rInner*Math.sin(a0);
    const large = sweep > Math.PI ? 1 : 0;
    const path = rInner>0
      ? `M ${x0} ${y0} A ${rOuter} ${rOuter} 0 ${large} 1 ${x1} ${y1} L ${xi0} ${yi0} A ${rInner} ${rInner} 0 ${large} 0 ${xi1} ${yi1} Z`
      : `M ${cx} ${cy} L ${x0} ${y0} A ${rOuter} ${rOuter} 0 ${large} 1 ${x1} ${y1} Z`;
    const slice = svgEl('path', {d:path, fill:color, class:'donut-slice', style:'cursor:pointer'});
    slice.addEventListener('mousemove', (e)=> showTip(container, tip, e, `<strong>${d.label}</strong><br>${fmtInt(d.value)} (${(frac*100).toFixed(1)}%)`));
    slice.addEventListener('mouseleave', ()=> hideTip(tip));
    svg.appendChild(slice);
    angle = a1;
  });

  if(rInner>0){
    const ct = svgEl('text', {x:cx, y:cy-4, 'text-anchor':'middle', class:'donut-center-num'});
    ct.textContent = fmtInt(total);
    svg.appendChild(ct);
    const ctl = svgEl('text', {x:cx, y:cy+16, 'text-anchor':'middle', class:'donut-center-lbl'});
    ctl.textContent = opts.centerLabel || 'Total';
    svg.appendChild(ctl);
  }

  wrap.appendChild(svg);

  if(opts.legend !== false){
    const leg = document.createElement('div');
    leg.className = 'chart-legend';
    data.forEach((d,i)=>{
      const item = document.createElement('div');
      item.className = 'legend-item';
      const frac = ((d.value/total)*100).toFixed(1);
      item.innerHTML = `<span class="legend-dot" style="background:${d.color||colorFor(i)}"></span><span class="legend-lbl">${d.label}</span><span class="legend-val">${fmtInt(d.value)} · ${frac}%</span>`;
      leg.appendChild(item);
    });
    wrap.appendChild(leg);
  }
  container.appendChild(wrap);
}

/* Area / line chart for chronological data */
function renderArea(container, data, opts={}){
  container.innerHTML='';
  container.classList.add('chart-wrap');
  const w = container.clientWidth || 700;
  const h = opts.height || 320;
  const padL = 54, padB = 70, padT = 24, padR = 24;
  const chartW = w - padL - padR;
  const chartH = h - padT - padB;
  const max = Math.max(...data.map(d=>d.value), 1) * 1.15;
  const n = data.length;
  const step = n>1 ? chartW/(n-1) : chartW;

  const svg = svgEl('svg', {viewBox:`0 0 ${w} ${h}`, width:'100%', height:h, class:'chart-svg'});
  const tip = makeTooltip(container);

  for(let g=0; g<=4; g++){
    const gy = padT + chartH - (chartH*g/4);
    svg.appendChild(svgEl('line', {x1:padL, x2:padL+chartW, y1:gy, y2:gy, class:'chart-grid'}));
    const gt = svgEl('text', {x:padL-8, y:gy+4, 'text-anchor':'end', class:'chart-axis'});
    gt.textContent = fmtInt(max*g/4);
    svg.appendChild(gt);
  }

  const pts = data.map((d,i)=>({x: padL + step*i, y: padT + chartH - (d.value/max)*chartH, d}));
  let areaPath = `M ${pts[0].x} ${padT+chartH} `;
  pts.forEach(p=> areaPath += `L ${p.x} ${p.y} `);
  areaPath += `L ${pts[pts.length-1].x} ${padT+chartH} Z`;
  const gradId = 'grad-' + Math.random().toString(36).slice(2,8);
  const defs = svgEl('defs');
  const grad = svgEl('linearGradient', {id:gradId, x1:0,y1:0,x2:0,y2:1});
  grad.appendChild(svgEl('stop', {offset:'0%','stop-color':'var(--accent-blue)','stop-opacity':0.55}));
  grad.appendChild(svgEl('stop', {offset:'100%','stop-color':'var(--accent-blue)','stop-opacity':0.03}));
  defs.appendChild(grad);
  svg.appendChild(defs);

  const area = svgEl('path', {d:areaPath, fill:`url(#${gradId})`, class:'area-fill'});
  svg.appendChild(area);

  let linePath = `M ${pts[0].x} ${pts[0].y} `;
  pts.forEach(p=> linePath += `L ${p.x} ${p.y} `);
  const line = svgEl('path', {d:linePath, fill:'none', stroke:'var(--accent-blue)', 'stroke-width':3, class:'area-line'});
  svg.appendChild(line);

  pts.forEach((p,i)=>{
    const isUC = data[i].isUC;
    const dot = svgEl('circle', {cx:p.x, cy:p.y, r:5, fill: isUC ? 'var(--accent-saffron)' : 'var(--accent-blue)', stroke:'var(--bg-panel)', 'stroke-width':2, style:'cursor:pointer'});
    dot.addEventListener('mousemove', (e)=> showTip(container, tip, e, `<strong>${data[i].label}</strong><br>${fmtInt(data[i].value)} dams`));
    dot.addEventListener('mouseleave', ()=> hideTip(tip));
    svg.appendChild(dot);
    const lbl = svgEl('text', {x:p.x, y:padT+chartH+18, 'text-anchor':'end', class:'chart-axis'});
    lbl.textContent = data[i].label;
    lbl.setAttribute('transform', `rotate(-35 ${p.x} ${padT+chartH+14})`);
    svg.appendChild(lbl);
  });

  container.appendChild(svg);
}

/* Simple pseudo-choropleth: ranked grid of state tiles sized/colored by value (no real GeoJSON needed) */
function renderStateTiles(container, data, opts={}){
  container.innerHTML='';
  container.classList.add('tile-grid');
  const max = Math.max(...data.map(d=>d.value), 1);
  data.forEach((d,i)=>{
    const intensity = 0.18 + 0.82*(d.value/max);
    const tile = document.createElement('div');
    tile.className='state-tile';
    tile.style.background = `linear-gradient(160deg, rgba(79,163,224,${intensity}), rgba(79,163,224,${intensity*0.55}))`;
    tile.innerHTML = `<div class="tile-rank">#${i+1}</div><div class="tile-name">${d.label}</div><div class="tile-val">${opts.fmt ? opts.fmt(d.value): fmtInt(d.value)}${opts.unit||''}</div>`;
    container.appendChild(tile);
  });
}

function renderGroupedStates(container, states){
  container.innerHTML='';
  const legend = document.createElement('div');
  legend.className = 'chart-legend inline-legend';
  legend.innerHTML = `
    <div class="legend-item"><span class="legend-dot" style="background:var(--accent-blue)"></span>Total</div>
    <div class="legend-item"><span class="legend-dot" style="background:var(--accent-green)"></span>Completed</div>
    <div class="legend-item"><span class="legend-dot" style="background:var(--accent-saffron)"></span>Under Construction</div>
  `;
  container.appendChild(legend);
  const grid = document.createElement('div');
  grid.className = 'grouped-grid';
  const max = Math.max(...states.map(s=>s.no_of_dams.total));
  states.forEach(s=>{
    const row = document.createElement('div');
    row.className = 'grouped-row';
    const pct = (s.no_of_dams.total/max)*100;
    const compPct = (s.no_of_dams.completed/s.no_of_dams.total)*100;
    const ucPct = (s.no_of_dams.under_construction/s.no_of_dams.total)*100;
    row.innerHTML = `
      <div class="grouped-label">${s.state_ut}</div>
      <div class="grouped-track" style="width:${pct}%">
        <div class="grouped-seg" style="width:${compPct}%; background:var(--accent-green)"></div>
        <div class="grouped-seg" style="width:${ucPct}%; background:var(--accent-saffron)"></div>
      </div>
      <div class="grouped-val">${fmtInt(s.no_of_dams.total)}</div>
    `;
    grid.appendChild(row);
  });
  container.appendChild(grid);
}

/* ---------- Dam-level tables (Important / SDSO) ---------- */
const DAM_COLS = [
  {key:'Sr.No.', label:'Sr.', numeric:true},
  {key:'PIC', label:'PIC', numeric:false},
  {key:'Name of Dam', label:'Name of Dam', numeric:false},
  {key:'State', label:'State', numeric:false},
  {key:'Dam Owner', label:'Dam Owner', numeric:false},
  {key:'Year of Commission', label:'Year', numeric:true, noGroup:true},
  {key:'Type of Dam', label:'Type', numeric:false},
  {key:'River Basin', label:'River Basin', numeric:false},
  {key:'River', label:'River', numeric:false},
  {key:'District', label:'District', numeric:false},
  {key:'Seismic Zone', label:'Zone', numeric:true},
  {key:'Height', label:'Height (m)', numeric:true},
  {key:'Dam Length', label:'Length (m)', numeric:true},
  {key:'Gross Storage Capacity', label:'Gross Stor. (MCM)', numeric:true},
  {key:'Effective Storage Capacity', label:'Eff. Stor. (MCM)', numeric:true},
  {key:'Designed Spillway Capacity', label:'Spillway (m\u00b3/s)', numeric:true},
  {key:'Purpose', label:'Purpose', numeric:false},
];
let tableState = { important:{q:'', sortKey:'Sr.No.', sortDir:'asc'}, sdso:{q:'', sortKey:'Sr.No.', sortDir:'asc'}, underconstruction:{q:'', sortKey:'Sr.No.', sortDir:'asc'}, privateowners:{q:'', sortKey:'Sr.No.', sortDir:'asc'} };

const DAM_TABLE_CONFIG = {
  important: {
    data: () => D.important,
    title: 'Dams of National Importance',
    sub: (n) => `${n} dams tracked nationally under the register.`,
  },
  sdso: {
    data: () => D.sdso,
    title: 'Dams for which NDSA is SDSO',
    sub: (n) => `${n} dams where the National Dam Safety Authority acts as the State Dam Safety Organisation.`,
  },
  underconstruction: {
    data: () => D.under_construction_details,
    title: 'Under-Construction Dams',
    sub: (n) => `${n} dams currently under construction across the country.`,
  },
  privateowners: {
    data: () => D.private_dam_details,
    title: 'Private Dam Owners',
    sub: (n) => `${n} dams held by non-government owners.`,
  },
};

function damTableSectionHTML(which){
  return `
    <div class="table-toolbar">
      <div class="search-box">
        ${icon('search')}
        <input type="text" id="dt-search-${which}" placeholder="Search by dam name, owner, state or river\u2026" />
      </div>
      <div class="row-count" id="dt-count-${which}"></div>
    </div>
    <div class="card table-card">
      <div class="scroll-mirror" id="dt-mirror-${which}"><div class="scroll-mirror-inner"></div></div>
      <div class="table-scroll tall" id="dt-table-${which}"></div>
    </div>
  `;
}

function wireDamTableSection(which, dataset){
  const input = $(`#dt-search-${which}`);
  input.value = tableState[which].q;
  input.addEventListener('input', ()=>{ tableState[which].q = input.value; drawDamTable(which, dataset); });
  drawDamTable(which, dataset);
}

function renderDamTable(root, which){
  const cfg = DAM_TABLE_CONFIG[which];
  const dataset = cfg.data();
  root.innerHTML = `
    ${panel(cfg.title, cfg.sub(dataset.length))}
    ${damTableSectionHTML(which)}
  `;
  wireDamTableSection(which, dataset);
}

function drawDamTable(which, dataset){
  const st = tableState[which];
  const q = st.q.trim().toLowerCase();
  let rows = dataset;
  if(q){
    rows = rows.filter(r =>
      String(r['Name of Dam']||'').toLowerCase().includes(q) ||
      String(r['State']||'').toLowerCase().includes(q) ||
      String(r['River']||'').toLowerCase().includes(q) ||
      String(r['Dam Owner']||'').toLowerCase().includes(q)
    );
  }
  $(`#dt-count-${which}`).textContent = `Showing ${rows.length} of ${dataset.length} dams`;
  const tblRoot = $(`#dt-table-${which}`);
  tblRoot.innerHTML = buildTable({ columns: DAM_COLS, rows, sortKey: st.sortKey, sortDir: st.sortDir, sticky:true });
  wireTable(tblRoot, (key, dir)=>{ st.sortKey = key; st.sortDir = dir; drawDamTable(which, dataset); });
  attachDualScroll($(`#dt-mirror-${which}`), tblRoot);
}

/* ---------- Under Construction ---------- */
function renderUnderConstruction(root){
  const ranked = [...D.under_constr].sort((a,b)=>b.value-a.value);
  const details = D.under_construction_details;
  root.innerHTML = `
    ${panel('Under-Construction Dams', 'Statewise progress alongside full details for every dam currently under construction.')}
    <div class="grid-2">
      <div class="card">
        <h3>Ranked by Under-Construction Count</h3>
        <div id="uc-bar" class="chart-holder chart-holder-tall"></div>
      </div>
      <div class="card">
        <h3>Share of National Under-Construction Total</h3>
        <div id="uc-donut" class="chart-holder"></div>
      </div>
    </div>
    ${damTableSectionHTML('underconstruction')}
  `;
  renderHBar($('#uc-bar'), ranked.map(r=>({label:r.state, value:r.value})), {rowH:24, gap:8});
  renderDonut($('#uc-donut'), ranked.slice(0,6).map(r=>({label:r.state, value:r.value})).concat(
    (()=>{ const rest = ranked.slice(6).reduce((a,r)=>a+r.value,0); return rest>0 ? [{label:'Other States', value:rest, color:'#5A6B7A'}] : []; })()
  ), {centerLabel:'U/C Dams', size:250});

  wireDamTableSection('underconstruction', details);
}

/* ---------- Private Dam Owners ---------- */
function renderPrivateOwners(root){
  const ranked = [...D.private_owners].sort((a,b)=>b.count-a.count);
  const details = D.private_dam_details;
  root.innerHTML = `
    ${panel('Private Dam Owners', 'Non-government entities holding ownership of specified dams, with full detail for every dam.')}
    <div class="grid-2">
      <div class="card">
        <h3>Ranked by Dams Owned</h3>
        <div id="po-bar" class="chart-holder chart-holder-tall"></div>
      </div>
      <div class="card">
        <h3>Type of Dam \u2014 Private Ownership</h3>
        <div id="po-donut" class="chart-holder"></div>
      </div>
    </div>
    ${damTableSectionHTML('privateowners')}
  `;
  renderHBar($('#po-bar'), ranked.map(r=>({label:r.owner, value:r.count})), {rowH:22, gap:6, labelW:230});
  renderDonut($('#po-donut'), D.private_types.map(t=>({label:t.type, value:t.count})), {centerLabel:'Dams', size:250});

  wireDamTableSection('privateowners', details);
}

/* ---------- Generic sortable table builder ---------- */
function buildTable({columns, rows, sortKey, sortDir, sticky}){
  const sorted = [...rows].sort((a,b)=>{
    let av = a[sortKey], bv = b[sortKey];
    av = safeNum(av) ?? av; bv = safeNum(bv) ?? bv;
    if(av===null || av===undefined) av = '';
    if(bv===null || bv===undefined) bv = '';
    if(typeof av === 'number' && typeof bv === 'number'){
      return sortDir==='asc' ? av-bv : bv-av;
    }
    av = String(av).toLowerCase(); bv = String(bv).toLowerCase();
    if(av<bv) return sortDir==='asc' ? -1 : 1;
    if(av>bv) return sortDir==='asc' ? 1 : -1;
    return 0;
  });
  const thead = `<thead><tr>${columns.map(c=>`
    <th data-key="${c.key}" class="${c.key===sortKey?'sorted-'+sortDir:''}">${c.label}${c.key===sortKey ? (sortDir==='asc'?' \u25B2':' \u25BC') : ''}</th>
  `).join('')}</tr></thead>`;
  const tbody = `<tbody>${sorted.map(r=>`<tr>${columns.map(c=>{
    let v = r[c.key];
    if(v===null || v===undefined || v==='-') v = c.numeric ? '\u2014' : (v==='-' ? 'N/A' : '\u2014');
    else if(c.numeric) v = (typeof v === 'number') ? (c.noGroup ? String(v) : (Number.isInteger(v) ? fmtInt(v) : fmtDec(v,2))) : v;
    return `<td class="${c.numeric?'num':''}">${v}</td>`;
  }).join('')}</tr>`).join('')}</tbody>`;
  return `<table class="data-table ${sticky?'sticky-head':''}">${thead}${tbody}</table>`;
}
function wireTable(root, onSort){
  $$('th', root).forEach(th=>{
    th.addEventListener('click', ()=>{
      const key = th.dataset.key;
      const curAsc = th.classList.contains('sorted-asc');
      const dir = curAsc ? 'desc' : 'asc';
      if(onSort) onSort(key, dir);
    });
  });
}

/* ---------- Dual (top+bottom) horizontal scrollbar for wide tables ---------- */
function attachDualScroll(mirrorEl, scrollEl){
  if(!mirrorEl || !scrollEl) return;
  const inner = mirrorEl.querySelector('.scroll-mirror-inner');
  const table = scrollEl.querySelector('table');
  if(!inner || !table) return;

  const sync = ()=>{
    inner.style.width = table.scrollWidth + 'px';
    mirrorEl.style.display = table.scrollWidth > scrollEl.clientWidth ? 'block' : 'none';
  };
  requestAnimationFrame(sync);

  let syncing = false;
  mirrorEl.onscroll = ()=>{
    if(syncing) return;
    syncing = true;
    scrollEl.scrollLeft = mirrorEl.scrollLeft;
    syncing = false;
  };
  scrollEl.onscroll = ()=>{
    if(syncing) return;
    syncing = true;
    mirrorEl.scrollLeft = scrollEl.scrollLeft;
    syncing = false;
  };
}

/* ---------- Home counters ---------- */
function runHomeCounters(){
  const els = $$('.counter');
  els.forEach((el, i)=>{
    const target = parseFloat(el.dataset.target);
    const decimals = parseInt(el.dataset.decimals || '0');
    animateCounter(el, target, {duration:2200, delay:i*130, decimals});
  });
}

/* ---------- Init ---------- */
function initHome(){
  const wrap = $('#home-counters');
  const tiles = [
    {label:'Total Dams', target:TOTAL_ROW.no_of_dams.total, decimals:0},
    {label:'Completed & Operational', target:TOTAL_ROW.no_of_dams.completed, decimals:0},
    {label:'Under Construction', target:TOTAL_ROW.no_of_dams.under_construction, decimals:0},
    {label:'Gross Storage (BCM)', target:TOTAL_ROW.gross_storage_capacity_bcm.total, decimals:3},
    {label:'Live Storage (BCM)', target:TOTAL_ROW.live_storage_capacity_bcm.total, decimals:3},
    {label:'States & UTs Covered', target:STATE_ROWS.length, decimals:0},
  ];
  wrap.innerHTML = tiles.map(t=>`
    <div class="home-stat">
      <div class="counter" data-target="${t.target}" data-decimals="${t.decimals}">0</div>
      <div class="home-stat-label">${t.label}</div>
    </div>
  `).join('');
}

document.addEventListener('DOMContentLoaded', ()=>{
  initHome();
  runHomeCounters();
  $('#cta-explore').addEventListener('click', ()=> go('overview'));
  $('#btn-home').addEventListener('click', goHome);
  renderNav();

  let resizeTimer = null;
  window.addEventListener('resize', ()=>{
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(()=>{
      if($('#app-screen').classList.contains('active') && currentTab !== 'mapexplorer'){
        renderTab(currentTab);
      }
    }, 200);
  });
});
